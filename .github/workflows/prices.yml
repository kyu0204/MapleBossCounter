name: 물욕템 시세 수집

# 경매장 시세를 받아 src/data/item_prices.json 에 커밋한다. 밀리면 Vercel 이 자동 배포한다.
#
# 왜 앱이 직접 안 부르나 — 경매장 API 는 로그인 쿠키를 요구한다. API 키가 아니라 세션이라
# 사용자에게 받을 수 없고, 남의 서버에 넘기게 해서도 안 된다. 그래서 여기서만 부르고
# 결과 JSON 만 앱으로 넘긴다. 배포된 앱에는 자격증명이 전혀 안 들어간다.
#
# 쿠키가 만료되면 이 작업만 빨갛게 실패하고 GitHub 이 메일을 보낸다. 앱은 기존 시세로
# 계속 돈다 — 값이 사라지는 것보다 오래된 값이 낫다.
on:
  schedule:
    - cron: "0 20 * * *" # 매일 05:00 KST
  workflow_dispatch:

concurrency:
  group: maple-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 시세 수집
        env:
          # 경매장 로그인 쿠키 (NPP 등). 3시간짜리 세션 토큰은 실행할 때마다 새로 받으므로
          # 여기에 되돌려 저장할 것은 없다.
          NEXON_COOKIE: ${{ secrets.NEXON_COOKIE }}
          TZ: Asia/Seoul
        run: node scripts/fetch-item-prices.mjs

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet -- src/data/item_prices.json; then
            echo "시세 변동 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/item_prices.json
          git commit -m "chore(prices): 경매장 시세 갱신"
          git push
