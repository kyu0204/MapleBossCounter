name: 물욕템 시세 수집

# 메이플증권(mitemprice.kr) 공개 페이지에서 시세를 받아 src/data/item_prices.json 에
# 커밋한다. 밀리면 Vercel 이 자동 배포한다.
#
# 자격증명이 하나도 없다. 경매장 내부 API 를 부르려면 로그인 쿠키가 필요했는데, 세션을
# CI 에 두면 해외 IP 에서 매일 접속하는 모양이 되고 쿠키가 새면 계정 자체가 위험했다.
# 지금은 사람이 보는 공개 페이지만 하루 한 번 읽는다 (robots.txt 가 "/" 를 허용하고
# "/api.php" 만 막아 두었으므로 API 는 부르지 않는다).
#
# 페이지 구조가 바뀌면 이 작업만 빨갛게 실패하고 GitHub 이 메일을 보낸다. 앱은 기존
# 시세로 계속 돈다 — 값이 사라지는 것보다 오래된 값이 낫다.
on:
  schedule:
    - cron: "0 20 * * *" # 매일 05:00 KST
  workflow_dispatch:

concurrency:
  group: maple-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 시세 수집
        env:
          TZ: Asia/Seoul
        run: node scripts/fetch-item-prices.mjs

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet -- src/data/item_prices.json; then
            echo "시세 변동 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/item_prices.json
          git commit -m "chore(prices): 물욕템 시세 갱신"
          git push
