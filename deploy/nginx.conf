# /etc/nginx/sites-available/maple-board  →  ln -s 로 sites-enabled 에 연결
# certbot --nginx -d example.com 실행 시 443 블록과 리다이렉트를 자동 추가한다. 아래는 HTTP 기본형.
# DOMAIN 을 실제 도메인으로 바꿀 것.

upstream maple_board {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 공개 조회(/lookup) 등 무거운 경로용 IP 리밋. 앱 내부 리미터(분당 20)와 이중.
limit_req_zone $binary_remote_addr zone=maple_lookup:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 수동 잡 트리거는 로컬에서만: curl -X POST -H "Authorization: Bearer $JOBS_SECRET" http://127.0.0.1/api/jobs/cache_sweep
    location /api/jobs/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://maple_board;
        include /etc/nginx/snippets/maple-proxy-headers.conf;
        proxy_read_timeout 600s;   # 스냅샷 잡은 캐릭터 수에 비례해 오래 걸림
    }

    location /lookup {
        limit_req zone=maple_lookup burst=10 nodelay;
        proxy_pass http://maple_board;
        include /etc/nginx/snippets/maple-proxy-headers.conf;
    }

    # 빌드 해시가 붙은 정적 자산은 장기 캐시
    location /_next/static/ {
        proxy_pass http://maple_board;
        include /etc/nginx/snippets/maple-proxy-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://maple_board;
        include /etc/nginx/snippets/maple-proxy-headers.conf;
    }
}
